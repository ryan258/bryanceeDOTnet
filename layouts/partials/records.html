{{ $isHome := .IsHome }}
<div class="records">
  {{ range (where site.RegularPages "Section" "album").ByWeight }}
    <div class="record">
      <img class="record-art" src="{{ .Params.cover | relURL }}" alt="" width="{{ .Params.coverWidth }}" height="{{ .Params.coverHeight }}" loading="lazy" decoding="async">
      <div class="record-copy">
        <p class="eyebrow">{{ .Params.category }}</p>
        {{ if $isHome }}<h3>{{ .Title }}</h3>{{ else }}<h2>{{ .Title }}</h2>{{ end }}
        <p>{{ .Params.summary }}</p>
        <a class="text-link" href="{{ .RelPermalink }}" aria-label="Listen &amp; explore {{ .Title }}">Listen &amp; explore <span aria-hidden="true">→</span></a>
      </div>
    </div>
  {{ end }}
</div>
