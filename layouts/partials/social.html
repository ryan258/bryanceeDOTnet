<ul class="social-links" aria-label="Bryan Cee on other platforms">
  {{ range site.Params.social }}
    <li>
      <a href="{{ .url }}" aria-label="{{ .name }}">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          {{ if eq .name "Instagram" }}
            <rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="2"/>
            <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/>
            <circle cx="17.5" cy="6.8" r="1.2" fill="currentColor"/>
          {{ else if eq .name "YouTube" }}
            <path fill="currentColor" fill-rule="evenodd" d="M5 5h14a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3V8a3 3 0 0 1 3-3Zm5 3.5v7l6-3.5-6-3.5Z"/>
          {{ else if eq .name "SoundCloud" }}
            <path fill="currentColor" d="M11 17V9a5 5 0 0 1 9 2 3 3 0 1 1 0 6h-9Z"/>
            <path d="M2 13v3m2.5-4v5M7 10v7m2.5-8v8" stroke="currentColor" stroke-linecap="round" stroke-width="1.3"/>
          {{ else if eq .name "Facebook" }}
            <path fill="currentColor" d="M14 22v-9h3l.5-4H14V7c0-1.2.4-2 2-2h2V1.4A21 21 0 0 0 15 1c-3 0-5 1.9-5 5.3V9H7v4h3v9Z"/>
          {{ end }}
        </svg>
        <span class="visually-hidden">{{ .name }}</span>
      </a>
    </li>
  {{ end }}
</ul>
