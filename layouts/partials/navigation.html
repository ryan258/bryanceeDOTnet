<ul class="{{ .class }}">
  {{ $page := .page }}
  {{ range site.Menus.main }}
    {{ $isMusic := and (eq .PageRef "/music") (eq $page.Section "album") }}
    <li><a href="{{ .URL }}"{{ if $page.IsMenuCurrent "main" . }} aria-current="page"{{ else if $isMusic }} aria-current="true"{{ end }}{{ if eq .PageRef "/contact" }} class="nav-contact"{{ end }}>{{ .Name }}</a></li>
  {{ end }}
</ul>
